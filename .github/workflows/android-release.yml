name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0"
        required: true
        default: "1.1"

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_KEY_ALIAS_SECRET_NAME: "ANDROID_RELEASE_KEY_ALIAS"
  RELEASE_KEY_PASSWORD_SECRET_NAME: "ANDROID_RELEASE_KEY_PASSWORD"
  RELEASE_KEYSTORE_SECRET_NAME: "ANDROID_RELEASE_KEYSTORE_BASE64"
  RELEASE_STORE_PASSWORD_SECRET_NAME: "ANDROID_RELEASE_STORE_PASSWORD"

jobs:
  release-signed-apk:
    name: Build And Publish Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make release scripts executable
        run: chmod +x scripts/*.sh

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v$VERSION"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          fi

          VERSION_CODE="$(bash scripts/version_code.sh "$VERSION")"
          APK_NAME="wenwenlex-${TAG}-release.apk"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "$ANDROID_CMDLINE_TOOLS_URL" -o "$RUNNER_TEMP/commandlinetools.zip"
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            echo "$ANDROID_SDK_ROOT/platform-tools"
            echo "$ANDROID_SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate release signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "Missing secret: $RELEASE_KEYSTORE_SECRET_NAME" >&2; exit 1; }
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || { echo "Missing secret: $RELEASE_STORE_PASSWORD_SECRET_NAME" >&2; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "Missing secret: $RELEASE_KEY_ALIAS_SECRET_NAME" >&2; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || { echo "Missing secret: $RELEASE_KEY_PASSWORD_SECRET_NAME" >&2; exit 1; }

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -PappVersionName=${{ steps.meta.outputs.version }}

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wenwenlex-release.jks"

      - name: Assemble signed release APK
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName=${{ steps.meta.outputs.version }} \
            -PreleaseStoreFile="$RUNNER_TEMP/wenwenlex-release.jks" \
            -PreleaseStorePassword="$ANDROID_RELEASE_STORE_PASSWORD" \
            -PreleaseKeyAlias="$ANDROID_RELEASE_KEY_ALIAS" \
            -PreleaseKeyPassword="$ANDROID_RELEASE_KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME"/build-tools/${ANDROID_BUILD_TOOLS}/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/${{ steps.meta.outputs.apk_name }}"

      - name: Prepare release notes
        run: |
          bash scripts/extract_changelog_section.sh "${{ steps.meta.outputs.version }}" CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Download"
            echo
            echo "- Asset: \`${{ steps.meta.outputs.apk_name }}\`"
            echo "- Build type: release-signed APK"
          } >> release-notes.md

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: release/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/$APK_NAME" --clobber
            gh release edit "$TAG" \
              --title "文文Lex $VERSION" \
              --notes-file release-notes.md \
              --latest
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              gh release create "$TAG" "release/$APK_NAME" \
                --target "$GITHUB_SHA" \
                --title "文文Lex $VERSION" \
                --notes-file release-notes.md \
                --latest
            else
              gh release create "$TAG" "release/$APK_NAME" \
                --verify-tag \
                --title "文文Lex $VERSION" \
                --notes-file release-notes.md \
                --latest
            fi
          fi
