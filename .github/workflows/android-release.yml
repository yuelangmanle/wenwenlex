name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0"
        required: true
        default: "1.0"

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  release-debug-apk:
    name: Build And Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make release scripts executable
        run: chmod +x scripts/*.sh

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v$VERSION"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          fi

          VERSION_CODE="$(bash scripts/version_code.sh "$VERSION")"
          APK_NAME="wenwenlex-${TAG}-debug.apk"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -PappVersionName=${{ steps.meta.outputs.version }}

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PappVersionName=${{ steps.meta.outputs.version }}

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${{ steps.meta.outputs.apk_name }}"

      - name: Prepare release notes
        run: |
          bash scripts/extract_changelog_section.sh "${{ steps.meta.outputs.version }}" CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Download"
            echo
            echo "- Asset: \`${{ steps.meta.outputs.apk_name }}\`"
            echo "- Build type: debug-signed APK"
          } >> release-notes.md

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: release/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/$APK_NAME" --clobber
            gh release edit "$TAG" \
              --title "文文Lex $VERSION" \
              --notes-file release-notes.md \
              --latest
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              gh release create "$TAG" "release/$APK_NAME" \
                --target "$GITHUB_SHA" \
                --title "文文Lex $VERSION" \
                --notes-file release-notes.md \
                --latest
            else
              gh release create "$TAG" "release/$APK_NAME" \
                --verify-tag \
                --title "文文Lex $VERSION" \
                --notes-file release-notes.md \
                --latest
            fi
          fi
